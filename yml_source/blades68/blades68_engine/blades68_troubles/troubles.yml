  group: heavy_local
  ongoing: true
  escilation: >-
    More trouble: Vandalism, No-Go Zone, Shakedown, Patrols.

    Rioters break into the crew’s base (Raid).
  description: >-
    The streets are engulfed in waves of riots. The riots may have spread from
    elsewhere in the city, or been provoked by local events. The riots could
    have noble motives or be driven by the worst prejudices. The crew might
    agree with the cause or despise it.

    Take -1d to the engagement roll, as well as +2 Heat, for any scores in this
    district while the riots are ongoing.
