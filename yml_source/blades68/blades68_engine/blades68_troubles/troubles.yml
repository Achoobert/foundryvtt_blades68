_id: 7a1b0c2d3e4f5003
name: Friendly Favor
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: false
  escilation: ''
  description: >-
    A friendly faction (or a contact) puts pressure on the crew to do something
    dangerous for them.

    This request will usually require a full score, but could be a smaller favor.
    Handle it like a personal mission with a failure clock, but it’s for the whole
    crew. Failure means -1 faction status.
effects: []
