img: icons/svg/item-bag.svg
system:
  group: heavy_crew
  ongoing: false
  escilation: ''
  description: >-
    An enemy faction makes a lethal move against your crew.

    Raid, but not necessarily on the crew’s base. What faction ordered the hit?
    The target might be one of the PCs or their cohorts. Alternatively, it could
    be a friend to a PC, or otherwise in their close circle. A good engagement roll
    result might mean the PCs get tipped off to the assassination in advance; a
    poor engagement roll might leave them desperately trying to staunch the
    bleeding before the target dies.
