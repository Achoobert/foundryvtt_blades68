_id: 7a1b0c2d3e4f5002
name: Debt
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: true
  escilation: >-
    The debt gets bigger: increase the clock size.

    An unpleasant message is sent to the debtor.
  description: >-
    Something has put a character or one of their close friends in the hole, and
    they need to make good on the debt.

    Create a 4-segment debt clock. Fill segments by spending stacks during
    downtime. Until the debt clock is filled, the debt hangs over the crew and
    might cause various other problems. The GM might create a second clock
    for the creditor’s patience, escalating each time it fills.
effects: []
folder: null
sort: 0
permission:
  default: 0
flags: {}
