---
_id: 7a1b0c2d3e4f500a
name: Things Get Weird
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: false
  escilation: ''
  description: >-
    A Class VI Metadimensional Entity (a “demon”) approaches the crew with
    a dark offer.

    Their desires can be impenetrable, but the rewards can be great: money,
    crew upgrades, or a favor owed by this all-powerful entity. What is the
    request and reward? Is it made to one person, or the whole crew?

    The request might require a score, or something simpler. If the deal is
    completed, the reward will be delivered. If the deal is refused, a rival
    faction might complete it instead.

    Accept their bargain, hide until it loses interest (forfeit 3 Rep), or deal
    with it another way.
effects: []
folder: null
sort: 0
permission:
  default: 0
flags: {}
