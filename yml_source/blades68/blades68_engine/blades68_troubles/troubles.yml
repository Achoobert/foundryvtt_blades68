name: Asking Around
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: false
  escilation: ''
  description: >-
    An investigator from another faction asks around about your crew,
    looking for insights. They could be an Inspector, a Bluecoat, a hound, a
    Reality Warden, or a corporate fixer.

    Make a 1d fortune roll to see how much dirt they come up with in the
    local community (1-3: +2 Heat and the faction learns a vulnerability or
    secret of the crew, 4/5: +2 Heat, 6: nothing).
