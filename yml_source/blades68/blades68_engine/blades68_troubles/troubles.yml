img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: true
  escilation: >-
    More trouble: Local Unrest, Under Investigation.

    A patrol does a raid on the crew’s base.
  description: >-
    A faction, probably the Bluecoats but maybe not, starts frequent patrols
    in your local district. They are armed and ready for trouble. They will
    suppress everything objectionable they can get away with.

    Take -1d to the engagement roll for scores in this district. An armed patrol
    unit is a potential complication in any such score.
