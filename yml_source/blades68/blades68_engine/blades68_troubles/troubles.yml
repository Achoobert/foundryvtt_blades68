  default: 0
flags: {}
---
_id: 7a1b0c2d3e4f5008
name: Shakedown
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: false
  escilation: ''
  description: >-
    Someone on the periphery of your crew is forced to spill what they know
    about you. They will not enjoy the experience.

    Decide which faction is behind the shakedown (Bluecoats are a good
    default) and identify an NPC member of the crew, a friend, or other close
    contact most likely to be singled out by them. Who is most vulnerable?

    Pay the culprits off with 2 stacks, or make a fortune roll to see how much
    the victim talks (1-3: +2 Heat; 4/5: +1 Heat; 6: nothing; critical: the
    NPC escapes with some useful information about the faction behind the
    shakedown).

    Roll 2d for a normal person to see how well they keep quiet. If they’re an
    experienced underworld type or some kind of tough, give them 3d or 4d
    instead. If they’re soft or if they have some loyalty to the law, give them 1d
    or 0d.
effects: []
folder: null
sort: 0
permission:
  default: 0
flags: {}
