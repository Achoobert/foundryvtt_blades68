    Tipped off: This surveillance crew tips off the target of your next score.
    Take an additional -1d to the engagement roll (-2d total).
  description: >-
    Another faction has your crew under surveillance. This is probably the
    Bluecoats, but could be any faction with the means and motive.

    As long as you’re under investigation, every score generates +1 Heat, and
    you take -1d to the engagement roll.
