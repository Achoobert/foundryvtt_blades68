_id: 7a1b0c2d3e4f5005
name: Interrogation
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: false
  escilation: ''
  description: >-
    One of the PCs is collared and hauled in for questioning. It’s quite likely
    the Bluecoats, but could be any faction who have the motive and means.
    How did they manage to capture you?

    Either pay them off with 3 stacks, or they beat you up (level 2 harm) and
    you tell them what they want to know (+3 Heat). You can resist each of
    those consequences separately.
