_id: 7a1b0c2d3e4f5009
name: Thieving Bastards
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: false
  escilation: ''
  description: >-
    Thieves target the crew’s base for a heist.

    Take away something belonging to the crew. It could be a piece of special
    equipment, their stacks (if they don’t have a vault), or something used as
    part of their downtime activities.

    This could be staged as a raid, giving the opportunity for the crew to
    defend themselves.
effects: []
