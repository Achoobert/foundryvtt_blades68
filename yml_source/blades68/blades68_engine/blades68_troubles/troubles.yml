_id: 7a1b0c2d3e4f5007
name: Rattling the Cage
type: trouble
img: icons/svg/item-bag.svg
system:
  group: light_crew
  ongoing: false
  escilation: ''
  description: >-
    An unfriendly faction sends a group into the district to cause trouble.
    They might be testing boundaries, gathering intel, delivering payback, or
    just trying to provoke trouble.

    Either leave them to it and forfeit 2 Rep per Tier of the faction, or
    confront them. This would involve a free play action roll or two—
    potentially costing Stress, harm, or other consequences like negative
    faction status.
effects: []
folder: null
