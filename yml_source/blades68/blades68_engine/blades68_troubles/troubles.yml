    A portion of the city is divided by a barrier, either between two districts
    or through the middle of one. It could be police barricades, a military
    blockade, an armed protest or insurrection, a construction project, a
    quarantine, or even just a mysterious wall.

    As long as the no-go zone is in place, it’s likely to give -1d to engagement
