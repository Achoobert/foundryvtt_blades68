    Harm to locals or to the crew.

    A faction starts making use of the object’s dark power, increasing in
    Tier immediately.
  description: >-
    Something strange is discovered in the local district. Maybe it’s a
    monolith of black stone, a large rock that fell from the sky, an unusual
    beast, or a gleaming silver ship that won’t open. Whatever it is, it’s a
    source of paranormal danger and harm.

    Decide the manner of harm it might deliver (radiation, attracting
    resonance entities, sinking the district into the water, psychic trauma,
