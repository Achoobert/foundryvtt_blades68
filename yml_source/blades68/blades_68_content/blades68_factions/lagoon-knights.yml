  notes: >-
    Clocks: Rise in Tier (8). Franchise Reed Castle (12).


    Prestige Ability - Wheeler Dealers: Once per Score, you can call up the
    Knights (during the Score or in a flashback), and you can either summon a
    Gang Cohort of your choice (equal to the Knights' current Tier), or an
    Expert Getaway Driver in a fine autopod or speedboat. The next time you
    make a Return the Favor roll for this backing faction, add +1d.
