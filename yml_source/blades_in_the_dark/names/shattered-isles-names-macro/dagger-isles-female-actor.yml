_id: 5JqCwEe02qm0fIsl
name: 'Actor Namer: Female Dagger Isles'
type: script
scope: global
img: icons/commodities/tech/electronics-button-skull-red.webp
command: |-
  async function drawFullName() {
    const givenTable = await fromUuid("Compendium.blades68.shattered-isles-names.RollTable.7d5dH7eoKHC8bnbC");
    const familyTable = await fromUuid("Compendium.blades68.shattered-isles-names.RollTable.1TYQKM7UOrcwYg9q");
    if (!givenTable || !familyTable) {
      ui.notifications.error("Compendium table not found!");
      return null;
    }
    const givenResult = await givenTable.draw({ displayChat: false });
    const familyResult = await familyTable.draw({ displayChat: false });
    const given = givenResult.results[0]?.description;
    const family = familyResult.results[0]?.description;
    if (!given) return null;
    return family ? `${given} ${family}` : given;
  }

  async function main() {
    const tokens = canvas.tokens.controlled;
    if (!tokens.length) {
      ui.notifications.warn("No tokens were selected");
      return;
    }
    const tokenUpdates = [];
    const actorUpdates = [];
    for (const token of tokens) {
      const name = await drawFullName();
      if (!name) continue;
      tokenUpdates.push({ _id: token.id, name });
      if (true && token.actor) {
        actorUpdates.push({ _id: token.actor.id, name, prototypeToken: { name } });
      }
    }
    if (actorUpdates.length) {
      await Actor.implementation.updateDocuments(actorUpdates);
    }
    if (tokenUpdates.length) {
      await canvas.scene.updateEmbeddedDocuments("Token", tokenUpdates);
    }
    ui.notifications.info(`Named ${tokenUpdates.length} actor(s).`);
  }

  main();
flags: {}
