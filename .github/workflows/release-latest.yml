# Builds a rolling "latest" GitHub Release on every push to the default
# branch. Only the patch semver segment is bumped in the packaged
# system.json (major.minor stay as in the repo). The repo file is not
# committed back — version stamping is release-only.
#
# This complements main.yml (which packages a specific, manually-published
# GitHub Release). This workflow instead gives players a stable
# "Install Module" URL that always points at the newest build off the
# default branch:
#   https://github.com/<repo>/releases/latest/download/system.json

name: Build Rolling Latest Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Compendium Packs
        run: npm run packs:build

      # Stamp only the patch segment for this rolling build.
      # Repo system.json stays put (e.g. 6.4.0). Artifact version is
      # major.minor.(patch + run_number) so each push is newer for Foundry
      # (6.4.0 run 3 -> 6.4.3, run 5 -> 6.4.5, ...).
      - name: Compute Next Version
        id: bump_version
        run: |
          current=$(jq -r '.version' system.json)
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((10#${patch:-0} + GITHUB_RUN_NUMBER))"
          echo "Bumping version: ${current} -> ${next} (patch only, release artifact)"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      # Write the new version and stamp the static "latest" manifest/download
      # URLs so Foundry's Install Module dialog can find updates.
      - name: Update system.json
        run: |
          jq --arg version "${{ steps.bump_version.outputs.next }}" \
             --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/system.json" \
             --arg download "https://github.com/${{ github.repository }}/releases/latest/download/system.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             system.json > system.json.tmp
          mv system.json.tmp system.json

      # Note that `zip` will only emit warnings when a file or directory
      # doesn't exist, it will not fail.
      - name: Create Module Archive
        run: |
          zip                                    \
            --recurse-paths                      \
            ./system.zip                         \
            system.json                          \
            template.json                        \
            README.md                            \
            LICENSE.txt                          \
            CHANGELOG.txt                        \
            templates/                           \
            module/                              \
            styles/                              \
            packs/                               \
            themes/                              \
            scss/                                \
            images/                              \
            lang/

      - name: Update Rolling "latest" Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          tag: latest
          commit: ${{ github.sha }}
          name: "Latest (${{ steps.bump_version.outputs.next }})"
          body: "Automated rolling build from ${{ github.repository }}@${{ github.sha }}."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './system.json, ./system.zip'
