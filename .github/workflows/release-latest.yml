# Builds a rolling "latest" GitHub Release on every push to the default
# branch. The packaged system.json is the repo file with a single field
# changed: version, whose patch segment continues from the previously
# released artifact. The repo file is not committed back.
#
# This complements main.yml (which packages a specific, manually-published
# GitHub Release). This workflow instead gives players a stable
# "Install Module" URL that always points at the newest build off the
# default branch:
#   https://github.com/<repo>/releases/latest/download/system.json

name: Build Rolling Latest Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Compendium Packs
        run: npm run packs:build

      # The previously published "latest" artifact is the only source for the
      # version number: its patch segment is incremented by one. Everything
      # else in the packaged manifest comes from the repo system.json.
      # If the repo bumps major.minor, that wins and patch restarts at 0.
      - name: Compute Next Version
        id: bump_version
        run: |
          repo_version=$(jq -r '.version' system.json)
          IFS='.' read -r repo_major repo_minor _ <<< "$repo_version"

          released_version=$(curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/latest/download/system.json" \
            | jq -r '.version // empty' || true)

          if [ -n "$released_version" ]; then
            IFS='.' read -r old_major old_minor old_patch <<< "$released_version"
          fi

          if [ "${old_major:-}" = "$repo_major" ] && [ "${old_minor:-}" = "$repo_minor" ]; then
            next="${repo_major}.${repo_minor}.$((10#${old_patch:-0} + 1))"
          else
            next="${repo_major}.${repo_minor}.0"
          fi

          echo "Released version: ${released_version:-none}; repo: ${repo_version}; next: ${next}"
          echo "released=${released_version}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      # Only the version is overwritten; manifest/download and all other
      # fields ship exactly as committed in system.json.
      - name: Update system.json
        run: |
          jq --arg version "${{ steps.bump_version.outputs.next }}" \
             '.version = $version' \
             system.json > system.json.tmp
          mv system.json.tmp system.json

      # Note that `zip` will only emit warnings when a file or directory
      # doesn't exist, it will not fail.
      - name: Create Module Archive
        run: |
          zip                                    \
            --recurse-paths                      \
            ./system.zip                         \
            system.json                          \
            template.json                        \
            README.md                            \
            LICENSE.txt                          \
            CHANGELOG.txt                        \
            templates/                           \
            module/                              \
            styles/                              \
            packs/                               \
            themes/                              \
            scss/                                \
            images/                              \
            lang/

      - name: Update Rolling "latest" Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          tag: latest
          commit: ${{ github.sha }}
          name: "Latest (${{ steps.bump_version.outputs.next }})"
          body: "Automated rolling build from ${{ github.repository }}@${{ github.sha }}."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './system.json, ./system.zip'
