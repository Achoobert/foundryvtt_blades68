# Builds a prerelease GitHub Release on every push to the `edge` branch.
# The packaged system.json is the repo file with id/title/manifest/download
# swapped to a distinct "Blades 68 EDGE" system, plus a version whose patch
# segment continues from the previously released edge artifact. The repo
# file is not committed back.
#
#   https://github.com/<repo>/releases/download/edge/system.json

name: Build Edge Prerelease

on:
  push:
    branches:
      - edge

concurrency:
  group: release-edge
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Compendium Packs
        run: npm run packs:build

      # download points at the `latest` rolling release, not the `edge` tag.

      - name: Compute Next Version
        id: bump_version
        run: |
          repo_version=$(jq -r '.version' system.json)
          IFS='.' read -r repo_major repo_minor _ <<< "$repo_version"

          released_version=$(curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/download/edge/system.json" \
            | jq -r '.version // empty' || true)

          if [ -n "$released_version" ]; then
            IFS='.' read -r old_major old_minor old_patch <<< "$released_version"
          fi

          if [ "${old_major:-}" = "$repo_major" ] && [ "${old_minor:-}" = "$repo_minor" ]; then
            next="${repo_major}.${repo_minor}.$((10#${old_patch:-0} + 1))"
          else
            next="${repo_major}.${repo_minor}.0"
          fi

          echo "Released version: ${released_version:-none}; repo: ${repo_version}; next: ${next}"
          echo "released=${released_version}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      # installs as a distinct system alongside the regular Blades '68 system rather than
      # colliding with it. All other fields stay as committed.
      - name: Update system.json and Create Module Archive
        run: |
          edge_base="https://github.com/${{ github.repository }}/releases/download/edge"
          jq --arg version "${{ steps.bump_version.outputs.next }}" \
             --arg id "blades68-edge" \
             --arg title "Blades 68 EDGE" \
             --arg manifest "$edge_base/system.json" \
             --arg download "$edge_base/system.zip" \
             '.version = $version | .id = $id | .title = $title | .manifest = $manifest | .download = $download' \
             system.json > system.json.tmp
          mv system.json.tmp system.json

          # Note that `zip` will only emit warnings when a file or directory
          # doesn't exist, it will not fail.
          zip                                    \
            --recurse-paths                      \
            ./system.zip                         \
            system.json                          \
            template.json                        \
            README.md                            \
            LICENSE.txt                          \
            CHANGELOG.txt                        \
            templates/                           \
            module/                              \
            styles/                              \
            packs/                               \
            themes/                              \
            scss/                                \
            images/                              \
            lang/

          unzip -p ./system.zip system.json | jq -e --arg version "${{ steps.bump_version.outputs.next }}" \
            '.version == $version'

      - name: Update "edge" Prerelease
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          prerelease: true
          tag: edge
          commit: ${{ github.sha }}
          name: "Edge (${{ steps.bump_version.outputs.next }})"
          body: "Automated edge prerelease build from ${{ github.repository }}@${{ github.sha }}."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./system.json, ./system.zip"
